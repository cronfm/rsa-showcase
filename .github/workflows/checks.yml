name: Verify showcase
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm test
      - run: dotnet build csharp/RsaShowcase.slnx -c Release
      - run: dotnet run --project csharp/RsaShowcase.Tests -c Release --no-build
      - run: dotnet run --project csharp/RsaShowcase.Original.Tests -c Release --no-build
      - run: npm run test:parity
      - run: npm run test:original-parity
      - run: npm run build
